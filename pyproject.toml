[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "pymp4v2"
version = "0.1.13"
description = "Python bindings for MP4v2 library"
readme = "README.md"
license = { text = "MIT AND MPL-1.1" }
requires-python = ">=3.9"
keywords = ["mp4", "video", "multimedia", "bindings"]
authors = [{ name = "Dmitriy Efimov", email = "daefimov@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Mozilla Public License 1.1 (MPL 1.1)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "flake8",
    "black",
    "isort",
    "mypy",
    "ruff",
    "tox",
    "bump4version",
]
doc = [
    "mkdocs",
    "mkdocs-include-markdown-plugin",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocs-autorefs",
]

[project.urls]
Homepage = "https://github.com/DarkDemiurg/pymp4v2"
Documentation = "https://github.com/DarkDemiurg/pymp4v2"
Repository = "https://github.com/DarkDemiurg/pymp4v2.git"
Issues = "https://github.com/DarkDemiurg/pymp4v2/issues"
Changelog = "https://github.com/DarkDemiurg/pymp4v2/blob/master/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
ninja.make-fallback = true
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/pymp4v2"]
wheel.license-files = ["LICENSE", "NOTICE", "licenses/mp4v2/COPYING"]
sdist.include = ["NOTICE", "licenses/mp4v2/COPYING"]
editable.rebuild = true

[tool.scikit-build.cmake.define]
CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"

[tool.cibuildwheel]
# CPython 3.9–3.13. PyPy, musllinux, 32-bit, and Windows ARM are skipped.
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-win32 *-win_arm64 *-manylinux_i686 *-musllinux_*"
test-requires = ["pytest"]
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.linux]
archs = ["auto64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.black]
target-version = ["py39"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"python/pymp4v2/__init__.py" = ["F401"]
"python/pymp4v2/__init__.pyi" = ["F401"]
"python/pymp4v2/raw.py" = ["F401", "F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
source = ["pymp4v2"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "def main",
]
